version: '3.8'

services:
  db:
    image: postgres:15
    container_name: catalog_db
    environment:
      POSTGRES_DB: games_db
      POSTGRES_USER: game_user
      POSTGRES_PASSWORD: ${database_password}
    ports:
      - "5433:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data

  meilisearch:
    image: getmeili/meilisearch:latest
    container_name: meilisearch
    environment:
      MEILI_MASTER_KEY: 'artem'
    ports:
      - "7700:7700"
    volumes:
      - meilisearch_data:/meili_data

  redis:
    image: redis:7-alpine
    container_name: catalog_redis
    ports:
      - "6379:6379"
    restart: always

volumes:
  pg_data:
  meilisearch_data:
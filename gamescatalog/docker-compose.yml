version: '3.8'

services:
  db:
    image: postgres:15
    container_name: catalog_db
    environment:
      POSTGRES_DB: games_db
      POSTGRES_USER: game_user
      POSTGRES_PASSWORD: '>&@)}#{=bNnRCgeCr8E=!/7'
    ports:
      - "5433:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data

volumes:
  pg_data:
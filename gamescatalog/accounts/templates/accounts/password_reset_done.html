{% extends 'accounts/base_registration.html' %}
{% block content %}
<div class="auth-page">
    <div class="auth-card" style="text-align: center;">
        <h1 class="auth-title">Email sent!</h1>
        <p class="auth-subtitle" style="margin-top: 8px;">Check your inbox and follow the link to reset your password.</p>
        <a href="{% url 'login' %}" class="auth-switch" style="display: block; margin-top: 24px;">← Back to Log in</a>
    </div>
</div>
{% endblock %}

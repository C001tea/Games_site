{% extends 'catalog/base.html' %}

{% block title %}Home{% endblock %}

{% block content %}
<p>Home</p>

<div class="div_catalog">
<ul class="ul_catalog">
{% for game in games_list %}
        <li>
            <div class="div_product">
                <img src="{{game.image}}" style="width:300px; height:300px" alt="image">
                <p>{{game.name}}</p>
            </div>
        </li>

{% endfor %}
</ul>
</div>
{% endblock %}

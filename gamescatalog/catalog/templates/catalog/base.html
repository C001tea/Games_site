<!DOCTYPE html>
{% load static %}

<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="{% static 'catalog/css/style.css' %}">
    <link rel="icon" type="image/png" href="{% static 'catalog/images/sprattus_can.png' %}">
    <title>{% block title %}My site{% endblock %}</title>
</head>

<body>
<div class="logo-search">
<a href="{% url 'home' %}"><img src="{% static 'catalog/images/sprattus_can.png' %}" style="width: 100px;"></a>

<form action="/search/" method="GET" class="search-form">
    <input type="text" name="q" placeholder="Search">
    <button type="submit" class="search-button">Найти</button>
</form>
</div>

<div class="main-layout">
    <aside class="sidebar">
        <h3 style="margin-top: 0"><a href="{% url 'home' %}" style="color: inherit; text-decoration: none;">Home</a></h3>
        <h3 style="margin-top: 0;">Browse</h3>
        <a href="/games/" style="color: inherit; text-decoration: none;"><p>All Games</p></a>
        <a href="{% url 'genres' %}" style="color: inherit; text-decoration: none;"><p>Genres</p></a>
        <a href="{% url 'platforms' %}" style="color: inherit; text-decoration: none;"><p>Platforms</p></a>
    </aside>

    <main class="content">
        {% block content %}
        {% endblock %}
    </main>

    <aside class="sidebar-ads">
        <div class="unit-ad">
            <p>Рекламный блок</p>
        </div>
    </aside>
</div>

</body>
</html>

{% extends 'catalog/base.html' %}

{% block title %}Platforms{% endblock %}

{% block meta_description %}Browse games by platform - PC, PlayStation, Xbox and more.{% endblock %}

{% block content %}
<div class="platforms">
{% for platform in platform_list %}
    <div class="platform">
    <a href="{% url 'all_games' %}?platform={{ platform.slug }}" style="color: inherit; text-decoration: none; cursor: pointer;">{{ platform.name }}</a>
    </div>
    {% endfor %}
</div>
{% endblock %}

{% if not request.COOKIES.cookie_consent %}
<div id="cookie-banner" style="position:fixed; bottom:0; left:0; right:0; z-index:9999; padding:16px; display:flex; justify-content:center;">
  <div style="max-width:680px; width:100%; background:#222222; border:1px solid #333333; border-radius:12px; padding:20px 24px; display:flex; flex-direction:column; gap:14px; box-shadow:0 4px 24px rgba(0,0,0,0.08);">

      <div style="display:flex; gap:14px; align-items:flex-start;">
      <div style="display:flex; align-items:center; justify-content:center; padding-top:2px;">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#999999" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 2a10 10 0 1 0 10 10c0-1.5-1-2.5-2.5-2.5a2.5 2.5 0 0 1-2.5-2.5c0-1.5-1-2.5-2.5-2.5A2.5 2.5 0 0 1 12 2z"/>
          <path d="M12 8h.01M16 12h.01M10 14h.01M14 16h.01M7 11h.01"/>
        </svg>
      </div>

      <div style="flex: 1;">
        <p style="margin:0 0 6px; font-size:15px; font-weight:600; color:#ffffff;">We use cookies</p>
        <p style="margin:0; font-size:13px; color:#aaaaaa; line-height:1.6;">
          We use cookies to ensure proper functionality, analyze traffic, and serve relevant ads.
          By continuing to browse, you agree to our
          <a href="{% url 'privacy' %}" style="color:#2563eb;">Privacy Policy</a>.
        </p>
      </div>
    </div>

    <div style="display:flex; gap:10px; justify-content:flex-end;">
      <button onclick="setCookieConsent('minimal')" style="padding:8px 16px; font-size:13px;
      border-radius:8px; cursor:pointer; background:transparent; border:1px solid #444444; color:#e5e5e5;"
      onmouseover="this.style.background='#383838'"
      onmouseout="this.style.background='#2d2d2d'">
          Essential only
      </button>
      <button onclick="setCookieConsent('all')" style="padding:8px 20px; font-size:13px;
      border-radius:8px; cursor:pointer; background:#ffffff; border:none; color:#111111; font-weight:500;"
      onmouseover="this.style.background='#f3f4f6'"
      onmouseout="this.style.background='#ffffff'">
          Accept all
      </button>
    </div>
  </div>
</div>
</div>

<script>
function setCookieConsent(level) {
  document.cookie = "cookie_consent=" + level + "; max-age=" + (365*24*60*60) + "; path=/; SameSite=Lax";
  document.getElementById('cookie-banner').style.display = 'none';
}
</script>
{% endif %}
